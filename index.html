<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本🌸粉紫輕旅行</title>
    <style>
        /* --- 核心樣式：日系簡約粉紫 --- */
        :root {
            --bg-color: #f8f1f9; /* 極淡粉紫背景 */
            --main-purple: #9d81ba; /* 主色調：粉紫 */
            --text-color: #4a4a4a;
            --accent-pink: #ffb7c5; /* 點綴：櫻花粉 */
            --white: #ffffff;
            --font-family: 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans GB', 'Heiti SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent; /* 移除手機點擊陰影 */
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 80px; /* 為底部導覽留白 */
        }

        /* --- 頁首 --- */
        header {

            text-align: center;
            padding: 20px 15px;
            border-bottom: 2px solid var(--accent-pink);
            position: sticky;
            top: 0;
            z-index: 100;
        }
