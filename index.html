<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 我們的日系旅遊計畫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #FAF5FF; font-family: 'Noto Sans TC', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(252, 231, 243, 0.8);
            border-radius: 2rem;
            transition: all 0.3s ease;
        }
        .edit-input:focus { outline: none; border-bottom: 2px solid #F472B6; }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-purple-400 mb-2">🌸 Japan Trip</h1>
            <p class="text-pink-400 italic">多人即時協作行程</p>
        </header>

        <div id="spots-list" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="col-span-full text-center py-10 text-gray-400">請確認已填寫 Supabase Key...</div>
        </div>
    </div>

    <script>
        // ⚠️ 請在此處填入你的 Supabase 資訊
        const SUPABASE_URL = '請填入你的URL'; 
        const SUPABASE_KEY = '請填入你的ANON_KEY';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadSpots() {
            const { data, error } = await _supabase.from('travel_spots').select('*').order('created_at');
            if (data) render(data);
        }

        function render(spots) {
            const container = document.getElementById('spots-list');
            container.innerHTML = spots.map(spot => `
                <div class="glass-card p-8 shadow-sm">
                    <input class="edit-input w-full text-2xl font-bold text-gray-700 bg-transparent mb-2" 
                           value="${spot.title}" onchange="update('${spot.id}', {title: this.value})">
                    <textarea class="edit-input w-full text-gray-500 bg-transparent h-24 resize-none text-sm"
                              onchange="update('${spot.id}', {description: this.value})">${spot.description || ''}</textarea>
                    <div class="flex justify-between items-center mt-4">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.address || spot.title)}" 
                           target="_blank" class="text-purple-500 font-bold text-sm">📍 地圖導覽</a>
                        <span class="text-xs text-pink-300 italic">Auto-syncing...</span>
                    </div>
                </div>
            `).join('');
        }

        async function update(id, fields) {
            await _supabase.from('travel_spots').update(fields).eq('id', id);
        }

        // 監聽即時變
